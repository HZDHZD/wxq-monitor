name: 万象棋公告监控

on:
  repository_dispatch:        # 主通道：Cloudflare Worker 每 10 分钟用 API 唤醒（不受 schedule 限流影响）
    types: [wake-monitor]
  schedule:
    - cron: "5,15,25,35,45,55 * * * *"   # 兜底通道：GitHub 自己的定时（新号被限流，实际以 dispatch 为准）
  workflow_dispatch:          # 允许手动触发一次

permissions:
  contents: write             # 需要把更新后的账本 commit 回仓库

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 等待错峰时刻（Cloudflare 唤醒时带 run_at，晚 5 分钟执行，与微信推送错开）
        if: github.event.client_payload.run_at != ''
        env:
          RUN_AT: ${{ github.event.client_payload.run_at }}
        run: |
          target=$(date -d "$RUN_AT" +%s)
          now=$(date +%s)
          wait=$(( target - now ))
          if [ "$wait" -gt 0 ]; then echo "sleep ${wait}s 到 $RUN_AT"; sleep "$wait"; fi

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装依赖
        run: pip install -r cloud/requirements.txt

      - name: 运行监控
        working-directory: cloud
        env:
          FROM_ADDR: ${{ secrets.FROM_ADDR }}
          AUTH_CODE: ${{ secrets.AUTH_CODE }}
          TO_ADDRS: ${{ secrets.TO_ADDRS }}
          PING_URL: ${{ secrets.PING_URL }}
        run: python monitor_cloud.py

      - name: 回写账本与心跳
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add cloud/seen_announcements.json cloud/last_run.txt
          git diff --cached --quiet || git commit -m "chore: update announcement ledger"
          git push
