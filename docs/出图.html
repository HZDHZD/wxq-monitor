﻿<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>更新公告重点 · 出图工具</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #14161c;
    --panel: #1c1f27;
    --panel2: #23262f;
    --line: #2e323d;
    --text: #e8eaf0;
    --sub: #8b93a5;
    --accent: #4d8bff;
  }
  html, body { height: 100%; }
  body {
    font-family: "PingFang SC", "Microsoft YaHei", "Hiragino Sans GB", sans-serif;
    background: var(--bg);
    color: var(--text);
    display: flex;
    overflow: hidden;
  }

  /* ============ 左侧控制面板 ============ */
  #panel {
    width: 400px;
    flex: none;
    height: 100vh;
    background: var(--panel);
    border-right: 1px solid var(--line);
    display: flex;
    flex-direction: column;
  }
  #panelHead { padding: 16px 18px 12px; border-bottom: 1px solid var(--line); }
  #panelHead h1 { font-size: 15px; font-weight: 700; letter-spacing: .5px; }
  .headRow { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .headBtns { flex: none; display: flex; gap: 6px; }
  .headBtn {
    flex: none; padding: 3px 9px; font-family: inherit;
    font-size: 11px; font-weight: 700;
    color: #d8a94e; background: #2a2416;
    border: 1px solid #4a3a12; border-radius: 6px; cursor: pointer;
  }
  .headBtn:hover { color: #ffe45c; border-color: #6a5418; }
  #btnAudit.ok { color: #6fae7f; background: #1b2a1f; border-color: #2f4a35; }
  #btnAudit.on { color: #14161c; background: #d8a94e; border-color: #d8a94e; }
  #btnAudit.on.ok { background: #6fae7f; border-color: #6fae7f; }
  #btnSort.on { color: #fff; background: var(--accent); border-color: var(--accent); }
  #panelHead p { font-size: 12px; color: var(--sub); margin-top: 4px; }

  #panelBody { flex: 1; overflow-y: auto; padding: 16px 18px 20px; }
  #panelBody::-webkit-scrollbar { width: 8px; }
  #panelBody::-webkit-scrollbar-thumb { background: #333846; border-radius: 4px; }

  .group { margin-bottom: 20px; }
  .label {
    font-size: 12px; color: var(--sub); font-weight: 600;
    margin-bottom: 8px; display: flex; align-items: center; gap: 6px;
  }
  .label .hint { font-weight: 400; color: #616b7f; font-size: 11px; }

  input[type=text], textarea {
    width: 100%;
    padding: 9px 11px;
    font-size: 13px;
    font-family: inherit;
    color: var(--text);
    background: var(--panel2);
    border: 1px solid var(--line);
    border-radius: 8px;
    outline: none;
    resize: vertical;
  }
  input[type=text]:focus, textarea:focus { border-color: var(--accent); }

  .field { margin-bottom: 10px; }
  .field:last-child { margin-bottom: 0; }

  .seg { display: flex; gap: 8px; }
  .seg button {
    flex: 1; padding: 9px 0;
    font-family: inherit; font-size: 12.5px; font-weight: 600;
    color: var(--sub); background: var(--panel2);
    border: 1px solid var(--line); border-radius: 8px; cursor: pointer;
  }
  .seg button.on { color: #fff; background: var(--accent); border-color: var(--accent); }

  select {
    width: 100%; padding: 9px 11px;
    font-size: 13px; font-family: inherit;
    color: var(--text); background: var(--panel2);
    border: 1px solid var(--line); border-radius: 8px;
    outline: none; cursor: pointer;
  }
  select:focus { border-color: var(--accent); }
  .dateRow { display: flex; align-items: center; gap: 8px; }
  .dateRow select { flex: 1; }
  .dateRow .unit { font-size: 12px; color: var(--sub); }

  .itemRow {
    background: var(--panel2);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 10px;
    margin-bottom: 10px;
    position: relative;
    cursor: grab;
  }
  .itemRow input, .itemRow textarea { cursor: text; }
  .itemRow .no {
    position: absolute; left: 10px; top: 10px;
    width: 20px; height: 20px; border-radius: 6px;
    background: #333846; color: var(--sub);
    font-size: 11px; font-weight: 700;
    display: flex; align-items: center; justify-content: center;
  }
  .itemRow .del {
    position: absolute; right: 8px; top: 8px;
    width: 22px; height: 22px; border: none; border-radius: 6px;
    background: transparent; color: #6b7488; font-size: 15px; line-height: 1;
    cursor: pointer;
  }
  .itemRow .del:hover { background: #3a2430; color: #ff6b81; }
  .itemRow .inner { margin-left: 28px; margin-right: 22px; }
  /* 上下移动：拖拽不好对位时用它，条目、分组、章节都有 */
  .mv {
    flex: none; width: 20px; height: 18px; padding: 0; border: none; border-radius: 5px;
    background: #2b3142; color: #8fa3d6; font-size: 9px; line-height: 1;
    cursor: pointer;
  }
  .mv:hover { background: #34405a; color: #cfe0ff; }
  /* 折叠：只留标题栏，方便把大标题拖到别的位置 */
  .fold {
    flex: none; width: 22px; height: 22px; padding: 0; border: none; border-radius: 6px;
    background: #2b3142; color: #8fc3ff; font-size: 13px; line-height: 1;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
  }
  .fold:hover { background: #34405a; color: #fff; }
  .secBox.folded > .secHead, .grpBox.folded > .grpHead { border-bottom: none; }
  .itemRow .mvCol {
    position: absolute; right: 7px; top: 34px;
    display: flex; flex-direction: column; gap: 3px;
  }
  /* 棋手 → 技能：技能是挂在棋手下面的子条目，只能跟着棋手整体移动 */
  .kidBox {
    margin-top: 8px; padding-left: 9px;
    border-left: 2px solid #3a4a6b;
  }
  .kidRow {
    display: flex; align-items: flex-start; gap: 6px;
    background: #1b1f2a; border: 1px solid #2f3444; border-radius: 7px;
    padding: 8px; margin-bottom: 6px;
  }
  .kidTag {
    flex: none; margin-top: 2px; padding: 3px 6px; border-radius: 5px;
    font-size: 10px; font-weight: 700;
    background: #4a3a12; color: #ffd76a;
  }
  .kidMain { flex: 1; min-width: 0; }
  .kidMain .kt { margin-bottom: 6px; }
  .kidOps { flex: none; display: flex; flex-direction: column; gap: 3px; }
  .kidAdd { margin-top: 0; }

  /* ---- 三级编辑器 ---- */
  .secBox {
    background: #1f2230;
    border: 1px solid #313746;
    border-radius: 12px;
    margin-bottom: 12px;
    overflow: hidden;
  }
  .secHead {
    display: flex; align-items: center; gap: 8px;
    padding: 8px 10px;
    background: #252a38;
    border-bottom: 1px solid #313746;
    cursor: grab;
  }
  .secHead input { cursor: text; }
  .secHead .tag {
    flex: none; font-size: 10.5px; font-weight: 700;
    padding: 3px 7px; border-radius: 5px;
    background: #2f4a7a; color: #a8c8f5;
  }
  .secHead input {
    flex: 1; padding: 6px 9px; font-size: 12.5px;
    background: #1b1e29; border: 1px solid #313746; border-radius: 6px;
    color: var(--text); font-family: inherit; outline: none;
  }
  .secHead input:focus { border-color: var(--accent); }
  .secBox > .secBody { padding: 10px; }

  .grpBox {
    background: #232734;
    border: 1px solid #2f3444;
    border-radius: 9px;
    margin-bottom: 10px;
  }
  .grpBox:last-child { margin-bottom: 0; }
  .grpHead {
    display: flex; align-items: center; gap: 8px;
    padding: 7px 9px;
    border-bottom: 1px solid #2f3444;
    cursor: grab;
  }
  .grpHead input { cursor: text; }
  .grpHead .tag {
    flex: none; font-size: 10px; font-weight: 700;
    padding: 3px 7px; border-radius: 5px;
    background: #5a4a1c; color: #ffe45c;
  }
  .grpHead input {
    flex: 1; padding: 6px 9px; font-size: 12.5px;
    background: #1b1e29; border: 1px solid #2f3444; border-radius: 6px;
    color: var(--text); font-family: inherit; outline: none;
  }
  .grpHead input:focus { border-color: var(--accent); }
  .grpBox > .grpBody { padding: 9px; }

  .iconBtn {
    flex: none; width: 24px; height: 24px; border: none; border-radius: 6px;
    background: transparent; color: #6b7488; font-size: 14px; line-height: 1;
    cursor: pointer;
  }
  .iconBtn:hover { background: #3a2430; color: #ff6b81; }
  .mv:disabled, .iconBtn:disabled { opacity: .28; cursor: not-allowed; }
  .mv:disabled:hover { background: #2b3142; color: #8fa3d6; }
  .iconBtn:disabled:hover { background: transparent; color: #6b7488; }

  /* ---- 拖动换位 ---- */
  .grip {
    flex: none; width: 22px; height: 22px; border-radius: 6px;
    display: flex; align-items: center; justify-content: center;
    color: #6b7488; font-size: 13px; line-height: 1;
    cursor: grab; user-select: none; -webkit-user-select: none;
  }
  .grip:hover { background: #2f3444; color: #a8c8f5; }
  .grip:active { cursor: grabbing; }
  .grip.lock { cursor: not-allowed; color: #8b93a5; }
  .grip.lock:hover { background: transparent; color: #8b93a5; }
  .itemRow .no.grip { cursor: grab; }
  .dragSrc { opacity: .4; }

  .miniAdd {
    width: 100%; margin-top: 8px; padding: 7px;
    font-family: inherit; font-size: 11.5px; font-weight: 600;
    color: #8fa3d6; background: transparent;
    border: 1px dashed #333a4a; border-radius: 7px; cursor: pointer;
  }
  .miniAdd:hover { background: #21252e; border-color: #4d8bff; color: #b9cbff; }

  .addBtn {
    width: 100%; padding: 10px;
    font-family: inherit; font-size: 12.5px; font-weight: 600;
    color: #9db4ff; background: transparent;
    border: 1px dashed #3d4658;
    border-radius: 10px; cursor: pointer;
  }
  .addBtn:hover { background: #21252e; border-color: #4d8bff; color: #b9cbff; }
  /* 排序视图：只留纯标题卡片，没有输入框，整张卡按住就能拖 */
  #sections.sort .secBox { margin-bottom: 8px; }
  #sections.sort .secBody { padding: 8px; }
  #sections.sort .grpBox { margin-bottom: 6px; }
  #sections.sort .grpBody { padding: 6px; }
  #sections.sort .secHead, #sections.sort .grpHead { padding: 8px 10px; cursor: grab; }
  #sections.sort .itemRow {
    display: flex; align-items: center; gap: 8px;
    padding: 8px 10px; margin-bottom: 6px; cursor: grab;
  }
  .sortName {
    flex: 1; min-width: 0; font-size: 12.5px; color: var(--text);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .sortNo {
    flex: none; width: 20px; height: 20px; border-radius: 6px;
    background: #333846; color: var(--sub); font-size: 11px; font-weight: 700;
    display: flex; align-items: center; justify-content: center;
  }
  .sortCnt { flex: none; font-size: 11px; color: #616b7f; }
  .sortLock { flex: none; font-size: 11px; }
  /* 排序视图里的 ▲▼：长列表拖不动时点一下挪一格 */
  .sortOps { flex: none; display: flex; gap: 2px; }
  #sections.sort .sortOps .mv { width: 22px; height: 20px; font-size: 10px; }

  #importTip1 { margin-top: 8px; font-size: 11.5px; color: #616b7f; line-height: 1.6; }
  #importTip1.err { color: #ff8b8b; }
  #auditWrap { display: none; padding: 8px 18px 10px; border-bottom: 1px solid var(--line); }
  #auditHead { font-size: 12px; font-weight: 700; color: #d8a94e; margin-bottom: 4px; }
  #auditHead.ok { color: #6fae7f; }
  #auditBox { max-height: 132px; overflow-y: auto; font-size: 11.5px; line-height: 1.65; color: #8a94a8; }
  #auditBox::-webkit-scrollbar { width: 6px; }
  #auditBox::-webkit-scrollbar-thumb { background: #333846; border-radius: 3px; }
  #auditBox .auditOk { color: #6fae7f; }
  #auditBox .auditNote { color: #616b7f; }
  #auditBox .auditItem { cursor: pointer; padding: 1px 0; }
  #auditBox .auditItem:hover { color: #d8a94e; text-decoration: underline; }
  .itemRow.auditHit, .grpHead.auditHit { outline: 2px solid #d8a94e; outline-offset: 2px; border-radius: 8px; }

  /* ---- 状态条：平时一行，点开改封面 ---- */
  #statusWrap { padding: 10px 18px; border-bottom: 1px solid var(--line); flex: none; }
  #statusBar {
    width: 100%; display: flex; align-items: center; justify-content: space-between; gap: 8px;
    background: var(--panel2); border: 1px solid var(--line); border-radius: 8px;
    padding: 7px 10px; font-family: inherit; text-align: left;
    color: var(--text); cursor: pointer;
  }
  #statusBar:hover { border-color: #46506b; }
  #statusBar .stMain { min-width: 0; display: flex; align-items: baseline; gap: 8px; }
  #statusBar b { font-size: 12.5px; font-weight: 700; }
  #statusBar i { font-style: normal; font-size: 11px; color: var(--sub); }
  .stCaret { flex: none; font-size: 11px; color: #616b7f; }
  #statusBar.on .stCaret, #importFold.on .stCaret { transform: rotate(90deg); }
  #coverBox { padding: 10px 0 0; display: flex; flex-direction: column; gap: 0; }
  #coverBox[hidden] { display: none; }
  .coverRow { display: flex; align-items: center; gap: 6px; }
  .coverRow .coverLbl { flex: none; font-size: 11.5px; color: var(--sub); }
  .coverRow input { flex: 1; padding: 6px 9px; font-size: 12.5px; }
  #coverBox .dateRow select { padding: 6px 9px; font-size: 12.5px; }
  #coverBox .seg button { padding: 6px 0; font-size: 12px; }

  /* ---- 手动粘贴：折叠成一行 ---- */
  .foldRow {
    width: 100%; display: flex; align-items: center; justify-content: space-between; gap: 8px;
    background: var(--panel2); border: 1px solid var(--line); border-radius: 8px;
    padding: 8px 11px; font-family: inherit; font-size: 12px; text-align: left;
    color: var(--text); cursor: pointer;
  }
  .foldRow:hover { border-color: #46506b; }
  .foldRow .foldMain { display: flex; align-items: baseline; gap: 6px; }
  .foldRow i { font-style: normal; font-size: 11px; color: #616b7f; }
  .foldRow.on { border-color: #3d4a63; }
  #grpImport1 { padding-top: 8px; }
  #grpImport1[hidden] { display: none; }
  .label.topGap { margin-top: 16px; }

  /* 本地双击打开时：粘公告链接，页面自己去抓 */
  .urlRow { display: flex; gap: 8px; align-items: center; }
  .urlRow[hidden] { display: none; }
  .urlRow input { flex: 1; min-width: 0; }
  .urlRow .addBtn { width: auto; flex: none; margin-top: 0; padding: 8px 14px; border-style: solid; }
  /* 最近几篇公告的下拉：窄一点、只显示标题开头，选完直接抓取 */
  .urlRow select { width: 120px; flex: none; padding: 7px 6px; font-size: 12px; }

  /* 条目标题行（不再放「原文」按钮，原文统一在预览右侧常驻栏） */
  .tRow { display: flex; gap: 6px; align-items: center; }
  .tRow .it { flex: 1; min-width: 0; }

  /* ============ 预览右侧的原文栏：一扇小窗，看公告原网页 ============ */
  #srcPanel {
    /* 屏幕窄的时候跟着缩，别把中间画布挤没了；要放得下网页排版所以比纯文本栏宽一些 */
    width: clamp(300px, 27vw, 440px); min-width: 0; flex: none; height: 100vh;
    background: var(--panel); border-left: 1px solid var(--line);
    display: flex; flex-direction: column;
  }
  #srcPanelHead {
    flex: none; padding: 13px 16px 11px; border-bottom: 1px solid var(--line);
    display: flex; align-items: baseline; gap: 8px;
  }
  #srcPanelHead b { font-size: 13px; font-weight: 700; }
  #srcPanelHead span { font-size: 11px; color: var(--sub); margin-left: auto; }
  #srcPanelBody { flex: 1; min-height: 0; overflow-y: auto; padding: 8px 14px 26px; }
  #srcPanelBody::-webkit-scrollbar { width: 8px; }
  #srcPanelBody::-webkit-scrollbar-thumb { background: #333846; border-radius: 4px; }
  /* 网页版：iframe 自己滚，四周留一点边像个小窗口 */
  #srcPanelBody.hasFrame { padding: 10px 10px 12px; overflow: hidden; }
  #srcFrame { display: block; width: 100%; height: 100%; border: 0; border-radius: 6px; background: #fff; }
  /* 纯文本回退（旧 JSON 没有网页版原文时用） */
  .srcAll {
    margin: 0; padding: 4px 0 0;
    font-family: inherit; font-size: 12px; line-height: 1.9;
    color: #b6bdcc; white-space: pre-wrap; word-break: break-word;
  }
  .srcEmpty { font-size: 12px; line-height: 1.8; color: var(--sub); padding: 14px 4px; }

  #panelFoot { padding: 14px 18px; border-top: 1px solid var(--line); display: flex; gap: 10px; position: relative; }
  #panelFoot button {
    flex: 1; padding: 12px;
    font-family: inherit; font-size: 13.5px; font-weight: 700;
    border-radius: 10px; cursor: pointer; border: none;
  }
  #btnExport { flex: 1; background: linear-gradient(135deg, #4d8bff, #7b5cff); color: #fff; }
  #btnExport:hover { filter: brightness(1.08); }

  /* ---- 底栏弹出的选篇菜单 ---- */
  .popMenu {
    position: absolute; bottom: 62px; z-index: 20;
    display: flex; flex-direction: column; gap: 6px;
    background: var(--panel2); border: 1px solid #3a4152; border-radius: 10px;
    padding: 8px; box-shadow: 0 14px 36px rgba(0,0,0,.5);
  }
  .popMenu[hidden] { display: none; }
  #exportMenu { right: 18px; left: 18px; }
  .popMenu button {
    flex: none; padding: 9px 10px; text-align: left;
    font-family: inherit; font-size: 12.5px; font-weight: 600;
    color: var(--text); background: transparent; border: 1px solid transparent; border-radius: 7px;
    cursor: pointer;
  }
  .popMenu button:hover { background: #2b3142; border-color: #3a4152; }
  .popMenu button:first-child { color: #b9cbff; }
  #exportMenu button[data-k=all] { color: var(--sub); font-weight: 500; }
  .pmHead { font-size: 11px; color: var(--sub); padding: 2px 10px 6px; }

  /* ============ 右侧预览 ============ */
  #stage {
    flex: 1;
    min-width: 0;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 44px 28px;
    background:
      radial-gradient(circle at 30% 20%, #1d2130 0%, transparent 55%),
      radial-gradient(circle at 80% 85%, #1a1f2e 0%, transparent 55%),
      #0f1116;
    position: relative;
    overflow: hidden;
  }
  #canvasWrap {
    position: relative;
    flex: none;
    line-height: 0;
    box-shadow: 0 20px 60px rgba(0,0,0,.55);
    border-radius: 4px;
    overflow: hidden;
  }
  canvas { display: block; }
  /* 平台 UI 遮挡区提示（顶 / 右 / 底，仅预览可见，不随导出输出） */
  .sg { position: absolute; pointer-events: none; }
  .sg span {
    font-size: 11px; line-height: 1; color: #ffd9cf;
    background: rgba(200,40,20,.75);
    padding: 3px 7px;
    white-space: nowrap;
  }
  .sgT {
    left: 0; right: 0; top: 0; height: 0;
    border-bottom: 1px dashed rgba(255,90,60,.85);
    background: repeating-linear-gradient(45deg, rgba(255,60,60,.14) 0 8px, rgba(255,60,60,.05) 8px 16px);
    align-items: flex-end; justify-content: flex-start;
  }
  .sgT span { border-radius: 0 0 6px 0; }
  .sgB {
    left: 0; right: 0; bottom: 0; height: 0;
    border-top: 1px dashed rgba(255,90,60,.85);
    background: repeating-linear-gradient(45deg, rgba(255,60,60,.14) 0 8px, rgba(255,60,60,.05) 8px 16px);
    align-items: flex-start; justify-content: flex-end;
  }
  .sgB span { border-radius: 6px 0 0 0; }
  .sgR {
    top: 0; bottom: 0; right: 0; width: 0;
    border-left: 1px dashed rgba(255,90,60,.85);
    background: repeating-linear-gradient(135deg, rgba(255,60,60,.14) 0 8px, rgba(255,60,60,.05) 8px 16px);
    align-items: flex-start; justify-content: flex-start;
  }
  .sgR span { border-radius: 0 0 6px 0; }
  #stageInfo {
    position: absolute; top: 14px; left: 50%; transform: translateX(-50%);
    font-size: 12px; color: var(--sub);
    background: rgba(20,22,28,.85);
    padding: 5px 12px; border-radius: 20px;
    border: 1px solid var(--line);
    white-space: nowrap;
  }
  /* 翻页控件（仅预览，不参与导出） */
  #pager {
    position: absolute; left: 50%; bottom: 12px; transform: translateX(-50%);
    display: none; align-items: center; gap: 8px;
    background: rgba(20,22,28,.92);
    border: 1px solid var(--line);
    padding: 6px 8px; border-radius: 22px;
    z-index: 5;
  }
  #pager.on { display: flex; }
  #pager button {
    width: 28px; height: 28px; border-radius: 50%;
    border: 1px solid var(--line); background: var(--panel2);
    color: var(--text); font-size: 15px; line-height: 1; cursor: pointer;
  }
  #pager button:disabled { opacity: .28; cursor: default; }
  #pager span { font-size: 12px; color: var(--sub); min-width: 52px; text-align: center; }
</style>
</head>
<body>

<div id="panel">
  <div id="panelHead">
    <div class="headRow">
      <h1>更新公告重点 · 出图工具</h1>
      <div class="headBtns">
        <button id="btnSort" class="headBtn" type="button">排序视图</button>
        <button id="btnAudit" class="headBtn" type="button" hidden>质检</button>
      </div>
    </div>
  </div>

  <!-- 状态条：日期和服务器由图 JSON 自动带出，平时只占一行；点开才展开封面与样式 -->
  <div id="statusWrap">
    <button id="statusBar" type="button">
      <span class="stMain"><b id="statusText">— · —</b><i id="statusHint">点开改封面</i></span>
      <span class="stCaret">▸</span>
    </button>
    <div id="coverBox" hidden>
      <div class="field dateRow">
        <select id="fMonth"></select><span class="unit">月</span>
        <select id="fDay"></select><span class="unit">日</span>
      </div>
      <div class="field seg" id="fServer">
        <button type="button" data-v="正式服" class="on">正式服</button>
        <button type="button" data-v="体验服">体验服</button>
      </div>
      <div class="field coverRow">
        <span class="coverLbl">正文字号</span>
        <input type="number" id="fScale" min="20" max="300" step="1" value="66" />
        <span class="unit">%</span>
      </div>
      <div class="field"><input type="text" id="fFoot" placeholder="底部署名 / 水印，可留空"></div>
    </div>
  </div>

  <!-- 质检单独一块：固定在编辑区上方，点条目跳到正文时这一块不跟着滚 -->
  <div id="auditWrap">
    <div id="auditHead">质检</div>
    <div id="auditBox"></div>
  </div>

  <div id="panelBody">

    <div class="field seg" id="fPart">
      <button type="button" data-v="in" class="on">局内</button>
      <button type="button" data-v="out">局外</button>
    </div>

    <!-- 粘贴公告链接或编号，页面自己去抓（线上 / 本地双击都显示） -->
    <div class="field urlRow" id="localUrlRow" hidden>
      <select id="recentSel" title="最近的更新公告"><option value="">最近…</option></select>
      <input type="text" id="localUrl" placeholder="粘贴公告链接或编号，例如 18916493">
      <button class="addBtn" id="btnLocalFetch" type="button">抓取并填充</button>
    </div>

    <!-- 手动粘贴只在网址自动填充失效时才用得上，平时收成一行 -->
    <button id="importFold" class="foldRow" type="button">
      <span class="foldMain">公告 JSON<i id="importState">手动粘贴导入</i></span>
      <span class="stCaret">▸</span>
    </button>
    <div id="grpImport1" hidden>
      <div class="field">
        <textarea id="importBox1" rows="6" placeholder="粘贴「公告提炼 → 复制整篇 JSON」的原样内容：第一篇是第一章（局内），其余章节是局外原文。导入后整体替换，不会重复叠加。"></textarea>
      </div>
      <button class="addBtn" id="btnImport1">导入整篇</button>
      <div id="importTip1"></div>
    </div>

    <div class="label topGap">重点内容 <span class="hint">拖卡片换位，▲▼ 一格一格挪</span></div>
    <div id="sections"></div>

  </div>

  <div id="panelFoot">
    <button id="btnExport">导出</button>

    <div id="exportMenu" class="popMenu" hidden>
      <div class="pmHead">导出哪一篇？</div>
      <button type="button" data-k="in">局内平衡篇</button>
      <button type="button" data-k="out">局外更新篇</button>
      <button type="button" data-k="all">合并全部（不带篇名）</button>
    </div>
  </div>
</div>

<div id="stage">
  <div id="stageInfo"></div>
  <div id="canvasWrap"><canvas id="cv"></canvas>
    <div class="sg sgT" id="sgT"><span>顶部遮挡区</span></div>
    <div class="sg sgR" id="sgR"><span>右侧按钮遮挡区</span></div>
    <div class="sg sgB" id="sgB"><span>底部文案遮挡区</span></div>
  </div>
  <div id="pager">
    <button id="pgPrev" type="button">‹</button>
    <span id="pgInfo">1 / 1</span>
    <button id="pgNext" type="button">›</button>
  </div>
</div>

<!-- 预览右侧的原文栏：整篇公告原文一次性铺在这里，不跟翻页、不按标题分组，自己上下滚 -->
<aside id="srcPanel">
  <div id="srcPanelHead"><b>公告原文</b><span id="srcPanelInfo"></span></div>
  <div id="srcPanelBody"></div>
</aside>

<script src="出图_基础.js?v=20261025m"></script>
<script src="出图_立绘.js?v=20261025m"></script>
<script src="出图_状态.js?v=20261025m"></script>
<script src="出图_排版.js?v=20261025m"></script>
<script src="出图_分页.js?v=20261025m"></script>
<script src="出图_交互.js?v=20261025m"></script>
<script src="出图_导入.js?v=20261025m"></script>
<script src="出图_数值表.js?v=20261025m"></script>
<script src="出图_导入导出.js?v=20261025m"></script>
</body>
</html>
